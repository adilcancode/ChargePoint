# ChargePoint Configuration File

# WebDriver Settings
webdriver.timeout=10
webdriver.implicitWait=10

# Target URL
target.url=https://www.flipkart.com/

# Search Settings
search.query=boat blue
search.maxResults=10

# Export Settings
export.csv.enabled=true
export.json.enabled=true
export.path=./exports/

# Logging Settings
logging.level=INFO

# Multi-threading Settings
thread.pool.size=3
thread.timeout=30